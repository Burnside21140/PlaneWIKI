{% extends 'layout.html' %}

{% block content %}
<script>
    window.addEventListener('load', function() {
        const sections = document.querySelectorAll('.pe-section');

        sections.forEach(section => {
            const img = section.querySelector('img');
            const text = section.querySelector('.pe-info p');

            if (img && text) {
                const imgHeight = img.clientHeight;
                const originalText = text.textContent;
                let truncatedText = originalText;

                // Create a temporary element to measure text height
                const tempElement = document.createElement('span');
                tempElement.style.visibility = 'hidden';
                tempElement.style.position = 'absolute';
                tempElement.style.whiteSpace = 'normal';
                tempElement.style.width = `${text.clientWidth}px`;
                tempElement.style.font = window.getComputedStyle(text).font;
                document.body.appendChild(tempElement);

                for (let i = originalText.length; i > 0; i--) {
                    tempElement.textContent = originalText.slice(0, i) + '...';

                    if (tempElement.clientHeight <= imgHeight) {
                        truncatedText = originalText.slice(0, i) + (i < originalText.length ? '...' : '');
                        break;
                    }
                }

                document.body.removeChild(tempElement);

                text.textContent = truncatedText;
            }
        });
    });
</script>
    

<div class="pe-container">
    <div class="pe-header">
        <div>
            <h1>Engines</h1>
        </div>
        <div class="pe-sort">
            <h1>Sort By</h1>
            <form method='GET' action="/engines">
                <select name="Sort" id="Sort" class="sort-select" onchange="this.form.submit()">
                    <option value="new" {% if sort_option == "new" %}selected{% endif %}>New</option>
                    <option value="old" {% if sort_option == "old" %}selected{% endif %}>Old</option>
                    <option value="mostViews" {% if sort_option == "mostViews" %}selected{% endif %}>Most Views</option>
                    <option value="leastViews" {% if sort_option == "leastViews" %}selected{% endif %}>Least Views</option>
                    <option value="A-Z" {% if sort_option == "A-Z" %}selected{% endif %}>A-Z</option>
                    <option value="Z-A" {% if sort_option == "Z-A" %}selected{% endif %}>Z-A</option>
                    <option value="bestRatings" {% if sort_option == "bestRatings" %}selected{% endif %}>Best Ratings</option>
                    <option value="worstRatings" {% if sort_option == "worstRatings" %}selected{% endif %}>Worst Ratings</option>
                    <option value="mostRatings" {% if sort_option == "mostRatings" %}selected{% endif %}>Most Ratings</option>
                    <option value="leastRatings" {% if sort_option == "leastRatings" %}selected{% endif %}>Least Ratings</option>
                </select>
            </form>
        </div>
    </div>
</div>

<div class="pe-container">
    <br>
    {% for engine in engines %}
    <a href="/engine/{{engine.0}}">
        <div class="pe-section">
            <div class="pe-header">
                <h1>{{engine.1}}</h1>
                {% if engine[4] is not none %}
                    <h1>Average Rating: {{ engine[4] | round(2) }}/5</h1>
                {% else %}
                    <h1>Average Rating: 0/5</h1>
                {% endif %}
            </div>
            <div class="pe-info">
                <img src="{{engine.3}}" alt="">
                <p>{{engine.2}}</p>
            </div>
        </div>
    </a>
    {% endfor %}
    <br>
</div>
{% endblock %}
